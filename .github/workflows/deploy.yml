name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Per SFTP auf Host Europe hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        if: env.SFTP_HOST != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Eingaben bereinigen: Protokoll, Leerzeichen, Pfad und Port aus dem Hostnamen entfernen
          SFTP_HOST="$(printf '%s' "$SFTP_HOST" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#^.*@##')"
          case "$SFTP_HOST" in *:*) SFTP_PORT="${SFTP_PORT:-${SFTP_HOST##*:}}"; SFTP_HOST="${SFTP_HOST%%:*}";; esac
          SFTP_PORT="$(printf '%s' "${SFTP_PORT:-22}" | tr -cd '0-9')"
          SFTP_USER="$(printf '%s' "$SFTP_USER" | tr -d '[:space:]')"
          echo "Host: Länge ${#SFTP_HOST}, Port: $SFTP_PORT"
          if ! getent hosts "$SFTP_HOST" >/dev/null; then
            echo "::error::Der Servername aus SFTP_HOST lässt sich nicht auflösen. Bitte in cPanel den genauen Servernamen prüfen (z. B. unter 'SSH-Zugriff' oder 'FTP-Konten')."
            exit 1
          fi
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open --env-password -u \"$SFTP_USER\" -p \"$SFTP_PORT\" sftp://$SFTP_HOST;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .well-known/ \
              --exclude-glob cgi-bin/ \
              dist/ \"${SFTP_PATH:-public_html}\"/
          "
